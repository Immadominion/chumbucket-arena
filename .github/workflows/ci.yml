# BFF + web CI: typecheck and test the Bun/tRPC BFF, prove the SQL migrations
# on a throwaway PostgreSQL 15, and build the chumbucket.fun Next.js site.
#
# Nothing here deploys. Railway and Vercel deploy from their own integrations;
# turn on "wait for CI" / required checks there so a red run blocks a deploy.
name: api-ci

on:
  push:
    branches: [main, master, "product/**", "fleet/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  bff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  migrations:
    # The *.postgres tests apply the Supabase migrations (they live in the
    # mobile repo) to a throwaway local PostgreSQL 15 and check the live rights.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: chumbucket-social-calls-api
      - uses: actions/checkout@v4
        with:
          repository: Immadominion/Chum-Bucket
          ref: ${{ vars.MOBILE_REPO_REF || 'product/social-calls-v3' }}
          path: chumbucket-social-calls
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: PostgreSQL 15 binaries
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-15
      - working-directory: chumbucket-social-calls-api
        run: bun install --frozen-lockfile
      - name: Migration tests
        working-directory: chumbucket-social-calls-api
        env:
          VERIFY_LOCAL_PG: "true"
          POSTGRES_BIN_DIR: /usr/lib/postgresql/15/bin
        run: bun test tests/*postgres*

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build chumbucket.fun
        env:
          # Public placeholders: the build needs the keys to exist, not to work.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build
